name: Top Languages card

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 07:17 Bangkok
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/top_langs.py", ".github/workflows/top-langs.yml"]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/top_langs.py xenodeve assets/top-langs.svg 10
      - name: Commit if it changed
        run: |
          git diff --quiet -- assets/top-langs.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          git commit -m "chore: refresh the Top Languages card"
          git push
